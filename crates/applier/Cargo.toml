[package]
name = "applier"
version = "0.1.0"
edition = "2021"
description = "Pure event-application logic shared by server and SDK. Defines the Projection trait (what mutations a projection store must support) and the apply() function (exhaustive match over domain::EventData)."

[dependencies]
async-trait = "0.1"
domain = { path = "../domain" }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
