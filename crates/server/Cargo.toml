[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "reset_password"
path = "src/bin/reset_password.rs"

[[bin]]
name = "set_admin_password"
path = "src/bin/set_admin_password.rs"

# [[bin]]
# name = "manage"
# path = "src/bin/manage.rs"
# Commented out - file doesn't exist

[dependencies]
# Shared domain types (events, permissions) — single source of truth
# for everything that crosses the wire to the client/sdk.
domain = { path = "../core/domain" }

# Shared event-application logic. Defines the Projection trait + apply() function
# so server and SDK can later share per-variant translation rules. Step 3a covers
# Contact events; Transaction (3b) and Permission (3c) still flow through the
# server's existing apply_*_typed methods.
applier = { path = "../core/applier" }

# Shared permission-resolution logic. PermissionStore trait + pure-Rust
# resolve_actions / permitted_contacts_for_action.
resolver = { path = "../core/resolver" }

# Shared snapshot logic. SnapshotStore trait + the should-snapshot
# rule + save-with-limit rotation. Server has its own SQL adapter.
snapshots = { path = "../core/snapshots" }

# Web framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-native-tls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Background tasks
tokio-cron-scheduler = "0.9"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Configuration
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4.38", features = ["serde"] }

# URL parsing
url = "2"

# Error handling
anyhow = "1"
thiserror = "1"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }


# Hashing for sync
sha2 = "0.10"

# WebSocket
tokio-tungstenite = "0.21"
axum-extra = { version = "0.9", features = ["typed-header"] }

# TLS support
tokio-rustls = "0.24"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls-pemfile = "1.0"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
axum-test = "8.0"
md-5 = "0.11.0"
