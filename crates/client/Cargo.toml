[package]
name = "client"
version = "0.1.0"
edition = "2021"
# Disable autodiscovery of integration tests: tests/single_app.rs etc. are NOT
# standalone test binaries — they are submodules pulled in by tests/integration.rs.
# Without this, Cargo would compile them twice (once standalone, where
# `crate::common::...` fails because they don't declare `mod common;`).
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
domain = { path = "../core/domain" }

# Shared event-application logic. Used to apply permission events to
# the client's local SQLite permission tables.
applier = { path = "../core/applier" }

# Shared permission resolution. Used to answer "can the user do X?"
# locally for UX (greying out buttons, etc.) — exact same rules the
# server enforces on push.
resolver = { path = "../core/resolver" }

# Shared snapshot logic. Client has its own SQLite-backed adapter so the
# UNDO rollback algorithm can be the same on both sides.
snapshots = { path = "../core/snapshots" }
chrono = { version = "0.4", features = ["serde"] }
flutter_rust_bridge = "=2.11.1"
log = "0.4"
md-5 = "0.10"
once_cell = "1.19"
reqwest = { version = "0.12", features = ["json"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
chrono = "0.4"
tempfile = "3.14"
uuid = { version = "1", features = ["v4"] }
