[package]
name = "domain"
version = "0.1.0"
edition = "2021"
description = "Shared domain types (events, permissions) used by both the backend and the client. Pure types, no I/O, no async, no DB, no FRB."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
